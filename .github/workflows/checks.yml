name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: List tracked LFS files
        run: git lfs ls-files || true
      - name: SHA256 bundles
        run: |
          if ls packages/*.zip 1> /dev/null 2>&1; then
            for f in packages/*.zip; do
              sha256sum "$f"
            done
          fi